
name: Build Gboard Plus RU APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f gboard-plus-ru-project.zip
          mkdir -p project
          unzip -q gboard-plus-ru-project.zip -d project

          test -f project/settings.gradle
          test -f project/app/build.gradle

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-$HOME/android-sdk}"

          mkdir -p "$SDK_ROOT/cmdline-tools"

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | head -n 1 || true)

          if [ -z "$SDKMANAGER" ]; then
            echo "Installing Android command-line tools..."

            curl -fL --retry 3 \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
              -o /tmp/android-tools.zip

            mkdir -p /tmp/android-tools
            unzip -q /tmp/android-tools.zip \
              -d /tmp/android-tools

            mkdir -p "$SDK_ROOT/cmdline-tools/latest"

            cp -a /tmp/android-tools/cmdline-tools/. \
              "$SDK_ROOT/cmdline-tools/latest/"

            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          chmod +x "$SDKMANAGER"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            --licenses > /dev/null || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GboardPlusRU-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
