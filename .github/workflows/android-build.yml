name: Build Gboard Plus RU APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        shell: bash
        run: |
          test -f gboard-plus-ru-project.zip || { echo 'Missing gboard-plus-ru-project.zip in repository root'; exit 1; }
          mkdir -p project
          unzip -q gboard-plus-ru-project.zip -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload ready-to-install APK
        uses: actions/upload-artifact@v4
        with:
          name: GboardPlusRU-Android-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
